<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taman Kosmik Makhluk Nasi Padang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="cosmicCanvas"></canvas>

    <div class="ui-layer">
        <div>
            <header class="top-bar">
                <div class="status-group">
                    <div id="moodDisplay" class="glass-pill">💖 Mood: Gurih &amp; Bahagia</div>
                    <div id="costumeDisplay" class="glass-pill">🍛 Kostum: Piring Polos Gemoy</div>
                </div>
                <button id="soundToggle" class="glass-pill" type="button">🔊 Suara: ON</button>
            </header>

            <div class="speech-wrap">
                <div id="speechBubble" class="speech-bubble">Boing~ Halo teman Nasi Padang! ✨</div>
            </div>
        </div>

        <footer class="bottom-controls">
            <div class="action-dock">
                <button id="feedDonutBtn" class="cute-btn btn-donut" type="button">🍩 Donat Kosmik</button>
                <button id="feedCandyBtn" class="cute-btn btn-candy" type="button">🍬 Bintang Permen</button>
                <button id="feedBobaBtn" class="cute-btn btn-boba" type="button">🧋 Boba Pelangi</button>
                <button id="costumeBtn" class="cute-btn btn-costume" type="button">🎩 Ganti Kostum</button>
                <button id="partyBtn" class="cute-btn btn-party" type="button">🪩 Mode Dansa</button>
            </div>
            <p class="hint-text">Tarik &amp; lempar Nasi Padang, usap puncaknya, atau klik piring yang bergoyang! 🍛✨</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
